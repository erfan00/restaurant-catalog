server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend service so the SPA can call /api/*
    # without hardcoding a backend hostname. Matches docker-compose's
    # "backend" service name.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: let React Router / client-side routing handle unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
